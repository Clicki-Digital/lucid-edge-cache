name: Publish plugin release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - '.github/release-version'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(tr -d '[:space:]' < .github/release-version)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate tag and PHP
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          plugin_version="$(php -r '$source=file_get_contents("lucid-edge-cache.php"); preg_match("/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+)/m", $source, $m); echo $m[1] ?? "";')"
          constant_version="$(php -r '$source=file_get_contents("lucid-edge-cache.php"); preg_match("/define\\(\x27LEC_VERSION\x27,[[:space:]]*\x27([^\x27]+)\x27\\)/", $source, $m); echo $m[1] ?? "";')"
          stable_version="$(awk -F': ' '/^Stable tag:/ {print $2; exit}' readme.txt)"
          test "$version" = "$plugin_version"
          test "$version" = "$constant_version"
          test "$version" = "$stable_version"
          find . -type f -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Build canonical WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/lucid-edge-cache
          rsync -a ./ dist/lucid-edge-cache/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'TESTING.md' \
            --exclude 'RELEASING.md'
          cd dist
          zip -q -r lucid-edge-cache.zip lucid-edge-cache
          sha256sum lucid-edge-cache.zip > lucid-edge-cache.zip.sha256
          test "$(unzip -Z1 lucid-edge-cache.zip | head -1)" = 'lucid-edge-cache/'
          test "$(unzip -Z1 lucid-edge-cache.zip | grep -c '^lucid-edge-cache/lucid-edge-cache.php$')" -eq 1

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Lucid Edge Cache ${RELEASE_TAG#v}"
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --generate-notes --title "Lucid Edge Cache ${RELEASE_TAG#v}"
            fi
          fi
          gh release upload "$RELEASE_TAG" \
            dist/lucid-edge-cache.zip \
            dist/lucid-edge-cache.zip.sha256 \
            --clobber
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
